<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>focusdot</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot" data-testid="brand-dot" data-phase="Idle"></span>
          <h1>focusdot</h1>
        </div>
        <span class="status-pill" data-testid="status-pill" data-phase="Idle">
          <span class="status-pulse" aria-hidden="true"></span>
          <span class="status-text">Idle</span>
        </span>
      </header>

      <!-- ============ TIMER ============ -->
      <section class="card timer-card" aria-labelledby="timer-title">
        <div class="section-head">
          <h2 id="timer-title">Current session</h2>
          <p class="phase" data-testid="timer-phase">Idle</p>
        </div>
        <p class="time" data-testid="timer-display">--:--</p>
        <div class="rail" aria-hidden="true">
          <div class="rail-fill" style="width: 0%"></div>
        </div>
        <div class="controls">
          <button type="button" id="btn-main" data-testid="btn-main" class="btn btn-primary btn-main">
            <span class="btn-icon" aria-hidden="true"></span>
            <span class="btn-label">Start</span>
          </button>
          <button type="button" id="btn-stop" data-testid="btn-stop" class="btn-link btn-stop" hidden>Stop</button>
        </div>
        <div class="preset-chips" data-testid="preset-chips"></div>
      </section>

      <!-- ============ STATS ============ -->
      <section class="card stats-card" aria-label="Statistics">
        <div class="stats-today">
          <div class="stats-today-main">
            <span class="stats-today-value" data-testid="focus-today">0m</span>
            <span class="stats-today-meta">today · <span data-testid="sessions-today">0</span> <span data-testid="sessions-word">sessions</span></span>
          </div>
          <div class="stats-streak" title="Consecutive days with at least one focus session">
            <span class="stats-streak-value" data-testid="streak-days">—</span>
            <span class="stats-streak-label">day streak</span>
          </div>
        </div>
        <div class="stats-periods">
          <div class="stats-period">
            <span class="stats-period-value" data-testid="focus-this-week">0h 0m</span>
            <span class="stats-period-label">Week</span>
          </div>
          <div class="stats-period">
            <span class="stats-period-value" data-testid="focus-this-month">0h 0m</span>
            <span class="stats-period-label">Month</span>
          </div>
          <div class="stats-period">
            <span class="stats-period-value" data-testid="focus-this-year">0h 0m</span>
            <span class="stats-period-label">Year</span>
          </div>
        </div>
      </section>

      <!-- ============ SETTINGS ============ -->
      <section class="card collapsible-card" aria-labelledby="settings-title">
        <details class="collapsible" data-testid="settings-section">
          <summary class="collapsible-trigger section-head">
            <h2 id="settings-title">Settings</h2>
            <span class="collapsible-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </summary>
          <div class="collapsible-body">
            <div class="toggle-list">
              <label class="toggle">
                <span class="toggle-text">
                  <span class="toggle-label">Auto-start next focus after break</span>
                  <span class="toggle-hint">When off, the timer stops after each break until you start again; you can still press Start focus now during a break to continue a multi-cycle plan.</span>
                </span>
                <span class="switch">
                  <input type="checkbox" id="auto-start-next-focus" />
                  <span class="switch-track"><span class="switch-thumb"></span></span>
                </span>
              </label>
              <label class="toggle">
                <span class="toggle-text">
                  <span class="toggle-label">Overtime tracking</span>
                  <span class="toggle-hint">When a focus block ends, keep counting extra time until you press Finish focus. The full session is logged then and break starts.</span>
                </span>
                <span class="switch">
                  <input type="checkbox" id="overtime-tracking" />
                  <span class="switch-track"><span class="switch-thumb"></span></span>
                </span>
              </label>
              <label class="toggle">
                <span class="toggle-text">
                  <span class="toggle-label">Session notifications</span>
                  <span class="toggle-hint">Desktop alerts when a focus or break block ends.</span>
                </span>
                <span class="switch">
                  <input type="checkbox" id="notifications-enabled" />
                  <span class="switch-track"><span class="switch-thumb"></span></span>
                </span>
              </label>
              <label class="toggle">
                <span class="toggle-text">
                  <span class="toggle-label">Launch on Windows startup</span>
                  <span class="toggle-hint">Open focusdot when you sign in.</span>
                </span>
                <span class="switch">
                  <input type="checkbox" id="launch-startup" />
                  <span class="switch-track"><span class="switch-thumb"></span></span>
                </span>
              </label>
              <div class="toggle toggle--action">
                <span class="toggle-text">
                  <span class="toggle-label">Focus history</span>
                  <span class="toggle-hint">Delete every logged session. Statistics start from zero.</span>
                </span>
                <button type="button" id="reset-history" class="btn-link-danger" title="Delete all focus history">Reset</button>
              </div>
            </div>
          </div>
        </details>
      </section>

      <!-- ============ PRESETS ============ -->
      <section class="card collapsible-card" aria-labelledby="presets-title">
        <details class="collapsible" data-testid="presets-section">
          <summary class="collapsible-trigger section-head">
            <h2 id="presets-title">Manage presets</h2>
            <span class="collapsible-chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </summary>
          <div class="collapsible-body">
            <ul id="preset-list" class="preset-list" data-testid="preset-list"></ul>

            <form id="preset-form" class="preset-form">
              <div class="form-eyebrow">New preset</div>
              <input type="hidden" id="preset-id" name="presetId" value="" />
              <label class="field" for="preset-name">
                <span>Name</span>
                <input id="preset-name" name="name" placeholder="Deep work" required />
              </label>
              <label class="field" for="focus-minutes">
                <span>Focus minutes</span>
                <input id="focus-minutes" name="focusMinutes" type="number" min="1" value="25" required />
              </label>
              <label class="field" for="break-minutes">
                <span>Break minutes</span>
                <input id="break-minutes" name="breakMinutes" type="number" min="1" value="5" required />
              </label>
              <label class="field" for="cycles">
                <span>Cycles</span>
                <input id="cycles" name="cycles" type="number" min="1" value="1" />
              </label>
              <div class="preset-form-actions">
                <button class="btn btn-primary" type="submit" id="preset-submit">Save preset</button>
                <button type="button" class="btn btn-link" id="preset-cancel-edit" hidden>Cancel edit</button>
              </div>
            </form>
            <p id="preset-error" class="error" role="alert"></p>
          </div>
        </details>
      </section>
    </main>

    <script type="module">
      import { bootstrap } from "/src/main.ts";
      bootstrap();
    </script>
  </body>
</html>
